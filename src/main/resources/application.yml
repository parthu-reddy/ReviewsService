spring:
  application:
    name: reviews-service
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reviews_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids: true
server:
  # SERVER_PORT, not PORT: compose sets SERVER_PORT=8099 and Deployment/reviews-service.yml now
  # reads the same variable. Two names for one port is how the two files drifted apart.
  port: ${SERVER_PORT:8099}
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
logging:
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

# The review domain's own tunables. A window exists because a rating written months later is about
# a memory rather than a meal, and because an unbounded window leaves every order in history a
# permanent write target.
reviews:
  window-days: ${REVIEWS_WINDOW_DAYS:14}
  write-rate-limit-per-minute: ${REVIEWS_WRITE_RATE_LIMIT:10}
  read-rate-limit-per-minute: ${REVIEWS_READ_RATE_LIMIT:100}
