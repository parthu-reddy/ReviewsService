# Stub resolution. LOCAL by default so a developer's `mvn test` behaves exactly as before and needs
# no credentials; CI overrides STUBRUNNER_MODE=REMOTE to resolve from the shared contracts registry
# instead of requiring every producer to be built into ~/.m2 first.
#
# Stub Runner does NOT read settings.xml credentials -- its own documentation says authentication
# details for repositories and profiles are not taken into account -- so it carries its own
# username/password rather than reusing .github/maven-settings.xml.
stubrunner:
  stubs-mode: ${STUBRUNNER_MODE:LOCAL}
  repository-root: ${STUBRUNNER_ROOT:}
  username: ${STUBRUNNER_USERNAME:}
  password: ${STUBRUNNER_PASSWORD:}

spring:
  config:
    import: ""
  redis:
    enabled: false
  main:
    allow-bean-definition-overriding: true
    web-application-type: none
  cloud:
    openfeign:
      client:
        config:
          default:
            readTimeout: 30000
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: none
  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
    - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
    - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: contract-test-verifier
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
eureka:
  client:
    enabled: false
management:
  health:
    redis:
      enabled: false


resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
